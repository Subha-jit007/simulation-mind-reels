name: Growth Agent

# Autonomous analyst: measures reach/engagement, learns what works, logs advice.
# Runs a few hours after the daily post. Never fakes engagement.

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC ~ a few hours after the reel posts
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run growth agent
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/agent.mjs

      # Keep the queue stocked. The 51-day plan ran out on 11 Aug; a silent
      # account loses distribution faster than a weak reel does.
      - name: Refill the content queue
        run: node scripts/refill.mjs --keep-ahead 7

      - name: Commit analytics, decisions + report
        run: |
          git config user.name "Subha-jit007"
          git config user.email "160590753+Subha-jit007@users.noreply.github.com"
          # reels.json is included because the agent now WRITES its decisions
          # there (length/palette/voice for upcoming days) instead of only
          # printing advice into a report nobody reads.
          git add content/analytics.json content/reels.json AGENT_LOG.md
          git commit -m "agent: measure, retune upcoming reels ($(date -u +%F))" || echo "nothing to commit"
          git push
